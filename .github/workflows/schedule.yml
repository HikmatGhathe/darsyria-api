name: VM start/stop schedule

# GitHub cron is UTC and best-effort (jobs at :00 get delayed/skipped most).
# So we use off-peak minutes and start a little early. Berlin summer = UTC+2:
#   06:45 UTC = 08:45 Berlin -> start (up by ~09:00 even if GitHub is late), Mon-Fri
#   15:15 UTC = 17:15 Berlin -> stop, Mon-Fri
# (Winter/CET shifts these one hour earlier in Berlin.)
on:
  schedule:
    - cron: '45 6 * * 1-5'
    - cron: '15 15 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'start or stop (manual)'
        required: true
        default: 'start'
        type: choice
        options: [start, stop]

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Decide start or stop
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "act=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 6 * * 1-5" ]; then
            echo "act=start" >> "$GITHUB_OUTPUT"
          else
            echo "act=stop" >> "$GITHUB_OUTPUT"
          fi

      - name: Start or stop the VM
        run: |
          if [ "${{ steps.decide.outputs.act }}" = "start" ]; then
            echo "Starting VM..."
            az vm start -g darsyria-rg -n darsyria-vm
          else
            echo "Deallocating VM..."
            az vm deallocate -g darsyria-rg -n darsyria-vm
          fi
