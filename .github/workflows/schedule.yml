name: VM business-hours schedule

# GitHub scheduled workflows are best-effort and can be delayed or skipped.
# Run frequent reconciliation checks and decide from the current Berlin time
# at execution, so delayed jobs cannot start the VM outside business hours.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Power action'
        required: true
        default: 'reconcile'
        type: choice
        options: [reconcile, start, stop]

permissions:
  contents: read

concurrency:
  group: darsyria-vm-power
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: DARSYRIA-RG
  AZURE_VM_NAME: darsyria-vm

jobs:
  power:
    runs-on: ubuntu-latest
    steps:
      - name: Decide the required power state
        id: decide
        env:
          MANUAL_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$MANUAL_ACTION" != "reconcile" ]]; then
            action="$MANUAL_ACTION"
          else
            berlin_day=$(TZ=Europe/Berlin date +%u)
            berlin_hour=$(TZ=Europe/Berlin date +%H)
            berlin_minute=$(TZ=Europe/Berlin date +%M)
            berlin_minutes=$((10#$berlin_hour * 60 + 10#$berlin_minute))

            if (( berlin_day >= 1 && berlin_day <= 5 \
              && berlin_minutes >= 480 && berlin_minutes < 1080 )); then
              action=start
            else
              action=stop
            fi
          fi

          echo "Berlin time: $(TZ=Europe/Berlin date --iso-8601=seconds)"
          echo "action=$action" | tee -a "$GITHUB_OUTPUT"

      - name: Azure login
        if: steps.decide.outputs.action != 'none'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Reconcile VM power state
        if: steps.decide.outputs.action != 'none'
        shell: bash
        run: |
          state=$(az vm get-instance-view \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" \
            --output tsv)

          if [[ "${{ steps.decide.outputs.action }}" == "start" ]]; then
            if [[ "$state" == "PowerState/running" ]]; then
              echo "VM is already running."
            else
              az vm start \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_VM_NAME"
            fi
          elif [[ "$state" == "PowerState/deallocated" ]]; then
            echo "VM is already deallocated."
          else
            az vm deallocate \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_VM_NAME"
          fi
