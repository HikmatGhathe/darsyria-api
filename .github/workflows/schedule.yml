name: VM business-hours schedule

# The Europe/Berlin timezone keeps the schedule correct across CET and CEST.
# Queue startup early enough to absorb GitHub scheduling delays. Queue shutdown
# before 15:00, but wait until 15:00 if the runner arrives early. Weekends have
# a stop-only safety check.
on:
  schedule:
    - cron: '10 8 * * 1-5'
      timezone: Europe/Berlin
    - cron: '30 14 * * 1-5'
      timezone: Europe/Berlin
    - cron: '15 8 * * 6,0'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      action:
        description: 'Power action'
        required: true
        default: 'stop'
        type: choice
        options: [start, stop]

permissions:
  contents: read

concurrency:
  group: darsyria-vm-power
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: DARSYRIA-RG
  AZURE_VM_NAME: darsyria-vm

jobs:
  power:
    runs-on: ubuntu-latest
    steps:
      - name: Decide the required power state
        id: decide
        env:
          MANUAL_ACTION: ${{ inputs.action }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            action="$MANUAL_ACTION"
          elif [[ "$TRIGGER_SCHEDULE" == "10 8 * * 1-5" ]]; then
            action=start
          else
            action=stop
          fi

          echo "Berlin time: $(TZ=Europe/Berlin date --iso-8601=seconds)"
          echo "action=$action" | tee -a "$GITHUB_OUTPUT"

      - name: Azure login
        if: steps.decide.outputs.action != 'none'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Reconcile VM power state
        if: steps.decide.outputs.action != 'none'
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [[ "${{ steps.decide.outputs.action }}" == "stop" ]] \
            && [[ "$TRIGGER_SCHEDULE" == "30 14 * * 1-5" ]]; then
            export TZ=Europe/Berlin
            target=$(date -d "$(date +%F) 15:00:00" +%s)
            now=$(date +%s)
            wait_seconds=$((target - now))

            if (( wait_seconds > 0 )); then
              echo "Waiting $wait_seconds seconds before the 15:00 shutdown."
              sleep "$wait_seconds"
            fi
          fi

          state=$(az vm get-instance-view \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" \
            --output tsv)

          if [[ "${{ steps.decide.outputs.action }}" == "start" ]]; then
            if [[ "$state" == "PowerState/running" ]]; then
              echo "VM is already running."
            else
              az vm start \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_VM_NAME"
            fi
          elif [[ "$state" == "PowerState/deallocated" ]]; then
            echo "VM is already deallocated."
          else
            az vm deallocate \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_VM_NAME"
          fi
