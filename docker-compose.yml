services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: darsyria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darsyria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-darsyria}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darsyria} -d ${POSTGRES_DB:-darsyria}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    container_name: darsyria-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Override the host .env value: inside the compose network, Postgres
      # is reachable by service name, not "localhost".
      DATABASE_URL: postgresql://${POSTGRES_USER:-darsyria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-darsyria}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Persist the embedding model cache so it survives container restarts
      # instead of re-downloading ~1.3GB on every redeploy.
      - embedding_cache:/root/.cache

  frontend:
    build:
      context: ../darsyria
      args:
        # Build args — NEXT_PUBLIC_* are inlined into the client bundle at
        # build time, so the browser-facing values (incl. the Sentry DSN) must
        # be passed here, not only as runtime env.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.0}
    container_name: darsyria-frontend
    restart: unless-stopped
    environment:
      # Server-side reads (server components, sitemap, metadata) — the API is
      # reachable by compose service name, not localhost, inside the network.
      INTERNAL_API_URL: http://api:8000
      # Absolute public origin, used server-side for canonical/OG/sitemap URLs.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  embedding_cache:
