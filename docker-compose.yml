services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: darsyria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: darsyria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: darsyria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darsyria -d darsyria"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
